name: Chaos Lab

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Seed for reproducible bug selection
        required: true
        default: 42
        type: number
      runs:
        description: Number of isolated bugs to inject
        required: true
        default: 10
        type: number
      mode:
        description: Bug source
        required: true
        default: mixed
        type: choice
        options:
          - mixed
          - catalog
          - mutation
  schedule:
    - cron: '0 10 * * 2'

permissions:
  contents: read

concurrency:
  group: chaos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chaos:
    name: Inject, detect and report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHAOS_SEED: ${{ github.event.inputs.seed || '42' }}
      CHAOS_RUNS: ${{ github.event.inputs.runs || '10' }}
      CHAOS_MODE: ${{ github.event.inputs.mode || 'mixed' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run detection-only campaign
        run: npm run chaos:campaign -- --seed "$CHAOS_SEED" --runs "$CHAOS_RUNS" --mode "$CHAOS_MODE"

      - name: Explain local-only autoheal
        run: echo "::notice::GitHub Actions runs detection only. Use npm run chaos:campaign -- --runs 3 --seed 7 --mode mixed --heal locally with your .env to enable AI autoheal."

      - name: Upload Chaos Lab reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: chaos-lab-report
          path: |
            reports/chaos/
            reports/chaos-summary.json
            reports/chaos.md
          retention-days: 30
