name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck + unit + API + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run golden-dataset evaluations
        run: npm run eval

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            reports/
          retention-days: 14

  quality-dashboard:
    name: AI-judged quality dashboard
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      LLM_PROVIDER: mock
      JUDGE_PROVIDER: gemini
      HEAL_PROVIDER: gemini
      TESTING_AI_PROVIDER: gemini
      GEMINI_JUDGE_MODELS: gemini-3.8-flash,gemini-3.6-flash
      GEMINI_HEAL_MODELS: gemini-3.8-flash,gemini-3.6-flash
      GEMINI_TESTING_MODELS: gemini-3.8-flash,gemini-3.6-flash
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify Gemini API key is configured
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Add GEMINI_API_KEY in repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Run deterministic evaluation and Gemini judge
        run: npm run eval:judge

      - name: Generate test cases from a user story
        run: npm run ai:testing -- generate examples/user-story.json

      - name: Triage a test failure with cited evidence
        run: npm run ai:testing -- triage examples/failure-report.json

      - name: Run isolated Chaos Lab campaign
        run: npm run chaos:campaign -- --runs 2 --seed 42 --mode mixed --heal

      - name: Build static dashboard
        run: npm run dashboard:build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
