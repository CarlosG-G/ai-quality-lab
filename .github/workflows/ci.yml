name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck + unit + API + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run golden-dataset evaluations
        run: npm run eval

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Execute reviewed ShopBot test plan
        run: npm run ai:testing:demo

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            reports/
          retention-days: 14

  quality-dashboard:
    name: Deterministic quality dashboard
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run deterministic evaluation
        run: npm run eval

      - name: Run isolated detection-only Chaos Lab campaign
        run: npm run chaos:campaign -- --runs 2 --seed 42 --mode mixed

      - name: Explain local-only AI checks
        run: echo "::notice::AI judge, test generation, failure triage, and autoheal use each developer's local .env and are not run in GitHub Actions."

      - name: Build static dashboard
        run: npm run dashboard:build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
